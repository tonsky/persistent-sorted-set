name: Build and deploy

on:
  push:
    branches:
      - '**'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    paths:
      - 'src-clojure/**'
      - 'src-java/**'
      - 'test-clojure/**'
      - project.clj
      - '.github/workflows/**'

jobs:  
  build:
    runs-on: ubuntu-latest

    env:
      CLOJARS_TOKEN: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - run: |
          echo "JAVA_HOME=$JAVA_HOME_11_X64" >> $GITHUB_ENV
          echo "JAVA8_HOME=$JAVA_HOME_8_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_11_X64/bin" >> $GITHUB_PATH

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest
          lein: latest
      
      - run: ./script/bootstrap.sh

      - run: ./script/test_clj.sh

      - run: ./script/test_cljs.sh

      - if: ${{ startsWith(github.ref, 'refs/tags/') }}
        name: Set version
        run: |
          sed -i 's/"0.0.0"/"${{ github.ref_name }}"/g' project.clj

      - run: lein jar

      - if: ${{ startsWith(github.ref, 'refs/tags/') }}
        name: Deploy to Clojars
        run: |
          lein deploy clojars

      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: 'target/*.jar'
